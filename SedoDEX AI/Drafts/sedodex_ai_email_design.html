    <script>
        const rawSource = document.getElementById('email-template-source').innerHTML.trim();

        // Render template into visual preview iframe
        const iframe = document.getElementById('email-iframe');
        iframe.contentWindow.document.open();
        iframe.contentWindow.document.write(rawSource);
        iframe.contentWindow.document.close();

        // Populate HTML code block
        document.getElementById('code-output').textContent = rawSource;

        // Viewport Switcher
        function setDeviceView(viewMode) {
            const frameContainer = document.getElementById('preview-frame-container');
            const btnDesktop = document.getElementById('btn-desktop');
            const btnMobile = document.getElementById('btn-mobile');

            if (viewMode === 'mobile') {
                frameContainer.style.maxWidth = '360px';
                btnMobile.className = "px-3 py-1 text-xs font-semibold rounded transition-all bg-rose-600 text-white shadow-sm";
                btnDesktop.className = "px-3 py-1 text-xs font-semibold rounded transition-all text-slate-400 hover:text-slate-200";
            } else {
                frameContainer.style.maxWidth = '620px';
                btnDesktop.className = "px-3 py-1 text-xs font-semibold rounded transition-all bg-rose-600 text-white shadow-sm";
                btnMobile.className = "px-3 py-1 text-xs font-semibold rounded transition-all text-slate-400 hover:text-slate-200";
            }
        }

        // Tab Switcher
        function switchTab(tab) {
            const previewDiv = document.getElementById('view-preview');
            const codeDiv = document.getElementById('view-code');
            const btnPreview = document.getElementById('tab-preview-btn');
            const btnCode = document.getElementById('tab-code-btn');

            if (tab === 'code') {
                previewDiv.classList.add('hidden');
                codeDiv.classList.remove('hidden');
                btnCode.className = "px-3 py-1 text-xs font-semibold rounded transition-all bg-slate-700 text-white";
                btnPreview.className = "px-3 py-1 text-xs font-semibold rounded transition-all text-slate-400 hover:text-slate-200";
            } else {
                codeDiv.classList.add('hidden');
                previewDiv.classList.remove('hidden');
                btnPreview.className = "px-3 py-1 text-xs font-semibold rounded transition-all bg-slate-700 text-white";
                btnCode.className = "px-3 py-1 text-xs font-semibold rounded transition-all text-slate-400 hover:text-slate-200";
            }
        }

        // Copy HTML Handler
        function copyEmailHTML() {
            const dummy = document.createElement('textarea');
            dummy.value = rawSource;
            document.body.appendChild(dummy);
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-20', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-20', 'pointer-events-none');
            }, 2500);
        }
    </script>
